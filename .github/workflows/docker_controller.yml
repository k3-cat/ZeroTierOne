name: "_ Build Docker Image for CV1 _"

on:
  workflow_call:

env:
  DOCKER_IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Builds
        uses: actions/download-artifact@v8
        with:
          name: zerotier-one

      - name: Download OTEL Libs
        uses: actions/download-artifact@v8
        with:
          name: opentelemetry-libs
          path: opentelemetry-libs/

      - name: Download golang-migrate
        run: |
          GONOSUMDB=* GOFLAGS='-p=1' go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Get Branch Name
        id: branch-name
        uses: tj-actions/branch-names@v9

      - name: Build and push container image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: amd64
          tags: |
              ${{ env.DOCKER_IMAGE_NAME }}:${{ github.ref_name }}
              ${{ env.DOCKER_IMAGE_NAME }}:${{ steps.branch-name.outputs.current_branch }}
          file: ext/central-controller-docker/Dockerfile.ci
          outputs: type=image,oci-mediatypes=true,compression=zstd,compression-level=3,force-compression=true,zstd-chunked=true

      - name: Image digest
        run: echo ${{ steps.publish.outputs.digest }}
